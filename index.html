<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 Student Performance Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display: flex; justify-content: center;
  align-items: center; padding: 20px;
}
.container {
  background: white; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  padding: 40px; max-width: 600px; width: 100%;
}
h1 { color: #333; margin-bottom: 8px; font-size: 26px; }
.subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 600; }
input {
  width: 100%; padding: 10px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 14px; transition: border 0.2s;
}
input:focus { outline: none; border-color: #667eea; }
button {
  grid-column: 1 / -1; padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  margin-top: 10px; transition: transform 0.2s;
}
button:hover { transform: translateY(-2px); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
#result {
  margin-top: 25px; padding: 20px; border-radius: 12px;
  background: #f8f9ff; border-left: 5px solid #667eea;
  display: none;
}
#result.show { display: block; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.grade-display { font-size: 42px; font-weight: bold; color: #667eea; text-align: center; margin: 10px 0; }
.risk-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 8px 0; }
.risk-high { background: #fee; color: #c00; }
.risk-low  { background: #efe; color: #080; }
ul { margin-top: 10px; padding-left: 20px; }
li { margin: 6px 0; font-size: 14px; color: #444; }
.error { background: #fee; color: #c00; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎓 Student Performance Tracker</h1>
  <p class="subtitle">Enter student metrics to get an ML prediction</p>

  <div class="grid">
    <div><label>Age</label><input type="number" id="age" value="17" min="15" max="22"></div>
    <div><label>Study Time (1-4)</label><input type="number" id="studytime" value="2" min="1" max="4"></div>
    <div><label>Absences</label><input type="number" id="absences" value="5" min="0" max="93"></div>
    <div><label>Past Failures</label><input type="number" id="failures" value="0" min="0" max="4"></div>
    <div><label>Go Out (1-5)</label><input type="number" id="goout" value="3" min="1" max="5"></div>
    <div><label>Free Time (1-5)</label><input type="number" id="freetime" value="3" min="1" max="5"></div>
    <div><label>Health (1-5)</label><input type="number" id="health" value="3" min="1" max="5"></div>
    <div><label>Alcohol (1-5)</label><input type="number" id="Dalc" value="1" min="1" max="5"></div>
    <button id="predictBtn" onclick="predict()">🔍 Predict Performance</button>
  </div>

  <div id="result"></div>
</div>

<script>
async function predict() {
  const btn = document.getElementById('predictBtn');
  const resultDiv = document.getElementById('result');
  btn.disabled = true; btn.textContent = '⏳ Predicting...';

  const payload = {
    age:       parseInt(document.getElementById('age').value),
    studytime: parseInt(document.getElementById('studytime').value),
    absences:  parseInt(document.getElementById('absences').value),
    failures:  parseInt(document.getElementById('failures').value),
    goout:     parseInt(document.getElementById('goout').value),
    freetime:  parseInt(document.getElementById('freetime').value),
    health:    parseInt(document.getElementById('health').value),
    Dalc:      parseInt(document.getElementById('Dalc').value)
  };

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.status === 'success') {
      const riskClass = data.at_risk ? 'risk-high' : 'risk-low';
      const riskText  = data.at_risk ? '⚠️ AT RISK' : '✅ SAFE';
      const tipsList  = data.recommendation.map(t => `<li>${t}</li>`).join('');

      resultDiv.className = 'show';
      resultDiv.innerHTML = `
        <h3>Prediction Results</h3>
        <div class="grade-display">${data.predicted_grade}/20</div>
        <div style="text-align:center;">
          <span class="risk-badge ${riskClass}">${riskText}</span>
        </div>
        <p style="text-align:center;color:#666;font-size:13px;">
          Risk Probability: <b>${(data.risk_probability*100).toFixed(1)}%</b>
        </p>
        <h4 style="margin-top:15px;">📋 Recommendations</h4>
        <ul>${tipsList}</ul>
      `;
    } else {
      resultDiv.className = 'show error';
      resultDiv.textContent = 'Error: ' + data.message;
    }
  } catch (err) {
    resultDiv.className = 'show error';
    resultDiv.textContent = 'Network error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Predict Performance';
  }
}
</script>
</body>
</html>
